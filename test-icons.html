<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图标测试</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            padding: 20px;
            background: #1e1e1e;
            color: #ccc;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: #252526;
            border-radius: 5px;
        }
        .icon-test {
            display: inline-flex;
            align-items: center;
            margin: 10px;
            padding: 10px;
            background: #333;
            border-radius: 3px;
        }
        .t-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            line-height: 1;
            font-style: normal;
            vertical-align: middle;
        }
        .t-icon-refresh::before { content: '🔄'; }
        .t-icon-rollback::before { content: '↻'; }
        .t-icon-swap::before { content: '🔁'; }
        .t-icon-setting::before { content: '⚙️'; }
    </style>
</head>
<body>
    <h1>图标显示测试</h1>
    
    <div class="test-section">
        <h2>方式1: 直接使用 Emoji</h2>
        <div class="icon-test">🔄 刷新</div>
        <div class="icon-test">🔁 同步</div>
        <div class="icon-test">⚙️ 设置</div>
        <div class="icon-test">↻ 回滚</div>
    </div>

    <div class="test-section">
        <h2>方式2: 使用 CSS ::before</h2>
        <div class="icon-test"><i class="t-icon t-icon-refresh"></i> 刷新</div>
        <div class="icon-test"><i class="t-icon t-icon-swap"></i> 同步</div>
        <div class="icon-test"><i class="t-icon t-icon-setting"></i> 设置</div>
        <div class="icon-test"><i class="t-icon t-icon-rollback"></i> 回滚</div>
    </div>

    <div class="test-section">
        <h2>方式3: 按钮中的图标</h2>
        <button style="padding: 10px; margin: 5px; font-size: 16px; cursor: pointer;">
            <i class="t-icon t-icon-refresh"></i>
        </button>
        <button style="padding: 10px; margin: 5px; font-size: 16px; cursor: pointer;">
            <i class="t-icon t-icon-swap"></i>
        </button>
        <button style="padding: 10px; margin: 5px; font-size: 16px; cursor: pointer;">
            <i class="t-icon t-icon-setting"></i>
        </button>
        <button style="padding: 10px; margin: 5px; font-size: 16px; cursor: pointer;">
            <i class="t-icon t-icon-rollback"></i>
        </button>
    </div>
</body>
</html>
