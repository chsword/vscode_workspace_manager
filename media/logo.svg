<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="folderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)" filter="url(#shadow)"/>
  
  <!-- Main folder (back) -->
  <g transform="translate(20, 35)">
    <path d="M 0 8 L 0 50 C 0 52 2 54 4 54 L 60 54 C 62 54 64 52 64 50 L 64 8 C 64 6 62 4 60 4 L 30 4 L 24 0 L 4 0 C 2 0 0 2 0 4 Z" 
          fill="url(#folderGradient)" opacity="0.6" filter="url(#shadow)"/>
  </g>
  
  <!-- Main folder (front) -->
  <g transform="translate(28, 42)">
    <path d="M 0 8 L 0 50 C 0 52 2 54 4 54 L 60 54 C 62 54 64 52 64 50 L 64 8 C 64 6 62 4 60 4 L 30 4 L 24 0 L 4 0 C 2 0 0 2 0 4 Z" 
          fill="url(#folderGradient)" filter="url(#shadow)"/>
    
    <!-- Folder tab accent -->
    <rect x="24" y="0" width="20" height="4" fill="url(#accentGradient)" rx="1"/>
  </g>
  
  <!-- Star icon (favorite) -->
  <g transform="translate(52, 60)">
    <path d="M 12 2 L 15 9 L 23 10 L 17 16 L 19 24 L 12 20 L 5 24 L 7 16 L 1 10 L 9 9 Z" 
          fill="#ffffff" opacity="0.9"/>
  </g>
  
  <!-- Connection dots (workspace sync) -->
  <circle cx="45" cy="78" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="64" cy="82" r="3" fill="#ffffff" opacity="0.8"/>
  <circle cx="83" cy="78" r="3" fill="#ffffff" opacity="0.8"/>
  
  <!-- Connection lines -->
  <line x1="45" y1="78" x2="64" y2="82" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="64" y1="82" x2="83" y2="78" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
</svg>
