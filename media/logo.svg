<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="folderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <!-- Four-corner frame gradients -->
    <linearGradient id="frameTopLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6bd36b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6bd36b;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="frameTopRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9a3c;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="frameBottomRight" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#62b4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#62b4ff;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="frameBottomLeft" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#cb70ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#cb70ff;stop-opacity:0" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Four-corner colorful frame (no background) -->
  <path d="M 24 4 L 4 4 L 4 24 L 10 24 L 10 10 L 24 10 Z" fill="url(#frameTopLeft)"/>
  <path d="M 104 4 L 124 4 L 124 24 L 118 24 L 118 10 L 104 10 Z" fill="url(#frameTopRight)"/>
  <path d="M 124 104 L 124 124 L 104 124 L 104 118 L 118 118 L 118 104 Z" fill="url(#frameBottomRight)"/>
  <path d="M 4 104 L 4 124 L 24 124 L 24 118 L 10 118 L 10 104 Z" fill="url(#frameBottomLeft)"/>
  
  <!-- Main folder (back) -->
  <g transform="translate(28, 32)">
    <path d="M 0 8 L 0 50 C 0 52 2 54 4 54 L 60 54 C 62 54 64 52 64 50 L 64 8 C 64 6 62 4 60 4 L 30 4 L 24 0 L 4 0 C 2 0 0 2 0 4 Z" 
          fill="url(#folderGradient)" opacity="0.6" filter="url(#shadow)"/>
  </g>
  
  <!-- Main folder (front) -->
  <g transform="translate(32, 40)">
    <path d="M 0 8 L 0 50 C 0 52 2 54 4 54 L 60 54 C 62 54 64 52 64 50 L 64 8 C 64 6 62 4 60 4 L 30 4 L 24 0 L 4 0 C 2 0 0 2 0 4 Z" 
          fill="url(#folderGradient)" filter="url(#shadow)"/>
    <rect x="24" y="0" width="20" height="4" fill="url(#accentGradient)" rx="1"/>
  </g>
</svg>
